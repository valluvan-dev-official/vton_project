services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile.gpu
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vton:vton@postgres:5432/vton
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      STORAGE_BACKEND: s3
      S3_BUCKET: amazon-sagemaker-960583974175-ap-south-1-ban3nm5kd4wvi9
      S3_REGION: ap-south-1
    volumes:
      - ../storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile.gpu
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vton:vton@postgres:5432/vton
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      STORAGE_BACKEND: s3
      S3_BUCKET: amazon-sagemaker-960583974175-ap-south-1-ban3nm5kd4wvi9
      S3_REGION: ap-south-1
      MODEL_S3_TAR: model/model.tar.gz
      DEVICE: cuda
      WEIGHTS_DIR: /app/ml/weights
      WORKSPACE: /tmp/vton_workspace
    volumes:
      - ../storage:/app/storage
      - ../ml:/app/ml
      # ml_weights is a named volume so the downloaded model persists across
      # container restarts (avoids re-downloading ~4 GB on every restart).
      - ml_weights:/app/ml/weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # -I app.workers.worker_startup registers the worker_ready signal handler
    # which bootstraps the model and pre-loads the GPU engine before the worker
    # starts accepting tasks.
    command: >
      celery -A app.workers.tasks.celery_app worker
      --loglevel=info
      --pool=solo
      -I app.workers.worker_startup
    # Healthcheck: ask Celery to ping the worker every 60 s.
    # Fails if the worker hasn't accepted a ping within 10 s.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "from app.workers.tasks import celery_app; r = celery_app.control.ping(timeout=10); exit(0 if r else 1)"
      interval: 60s
      timeout: 15s
      start_period: 300s   # allow 5 min for model bootstrap + GPU load on first start
      retries: 3

  flower:
    build:
      context: ..
      dockerfile: api/Dockerfile.gpu
    ports:
      - "5555:5555"
    env_file: ../.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A app.workers.tasks.celery_app flower --port=5555

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vton
      POSTGRES_PASSWORD: vton
      POSTGRES_DB: vton
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vton"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  # Named volume so downloaded model weights persist across worker restarts.
  # On EC2 this avoids re-downloading 4 GB from S3 every time the container
  # is restarted (e.g. after a code-only rebuild).
  ml_weights:

networks:
  default:
    name: vton_net
    external: true
