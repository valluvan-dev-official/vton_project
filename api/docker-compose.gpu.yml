services:

  # ── FastAPI ────────────────────────────────────────────────────────────────
  # Builds from the lightweight CPU-only api/Dockerfile, NOT Dockerfile.gpu —
  # the API process only enqueues Celery jobs (task.delay()) and never runs
  # GPU inference itself, so it needs no CUDA base image, torch, or diffusers.
  # This also decouples its image from the worker's: an api/app/routes,
  # schemas, or static/ change now only rebuilds this image, never worker's.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vton:vton@postgres:5432/vton
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      STORAGE_BACKEND: s3
      S3_BUCKET: amazon-sagemaker-960583974175-ap-south-1-ban3nm5kd4wvi9
      S3_REGION: ap-south-1
    volumes:
      - ../storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery GPU worker ──────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile.gpu
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vton:vton@postgres:5432/vton
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      STORAGE_BACKEND: s3
      S3_BUCKET: amazon-sagemaker-960583974175-ap-south-1-ban3nm5kd4wvi9
      S3_REGION: ap-south-1
      MODEL_S3_TAR: model/idm_model.tar.gz/idm_model.tar.gz
      DEVICE: cuda
      WEIGHTS_DIR: /app/ml/weights
      WORKSPACE: /tmp/vton_workspace
      DEBUG_VISUALIZATION: ${DEBUG_VISUALIZATION:-false}
    volumes:
      # Bind-mount the entire ml/ tree so scripts, configs, and weights are
      # all available under /app/ml inside the container.
      # /app/ml/weights therefore maps directly to ml/weights/ on the host
      # where the checkpoints already reside.
      # NO named volume is mounted on top of this path — that would shadow
      # the host weights and make them invisible to the container.
      - ../storage:/app/storage
      - ../ml:/app/ml
      # Persistent caches — named volumes survive container recreation
      # (unlike the container's own writable layer), so a worker recreate
      # no longer re-clones/re-downloads any of this from scratch:
      #   - idm_vton_workspace: the IDM-VTON repo git-cloned by
      #     gpu_inference.py's _ensure_repos() into WORKSPACE (below).
      #   - rembg_cache: rembg's U2Net background-removal model, downloaded
      #     to ~/.u2net (root's HOME is /root) on first use.
      #   - hf_cache / torch_cache: default Hugging Face / torch hub cache
      #     locations, in case any component reaches out for extra weights
      #     (e.g. tokenizer/config metadata) beyond the local /app/ml/weights
      #     checkpoints already used for the core IDM-VTON model loading.
      - idm_vton_workspace:/tmp/vton_workspace
      - rembg_cache:/root/.u2net
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # -I app.workers.worker_startup registers the worker_ready signal handler,
    # which bootstraps the model and pre-loads the GPU engine before the worker
    # starts accepting tasks.
    command: >-
      celery -A app.workers.tasks.celery_app worker
      --loglevel=info
      --pool=solo
      -I app.workers.worker_startup
    # Healthcheck: ping the Celery worker every 60 s.
    # start_period allows up to 5 min for GPU model load on first boot.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "from app.workers.tasks import celery_app; r = celery_app.control.ping(timeout=10); exit(0 if r else 1)"
      interval: 60s
      timeout: 15s
      start_period: 300s
      retries: 3

  # ── Flower (Celery dashboard) ────────────────────────────────────────────────
  # Same lightweight image as api: flower only imports app.workers.tasks to
  # read celery_app for monitoring — it never runs GPU inference either.
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A app.workers.tasks.celery_app flower --port=5555

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vton
      POSTGRES_PASSWORD: vton
      POSTGRES_DB: vton
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vton"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  idm_vton_workspace:
  rembg_cache:
  hf_cache:
  torch_cache:

networks:
  default:
    name: vton_net
    external: true
